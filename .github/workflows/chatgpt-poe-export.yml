name: ChatGPT PoE build export

# Triggered after workflow creation so GitHub actually schedules the branch run.
on:
  push:
    branches:
      - chatgpt-poe-export-20260730
    paths:
      - tools/chatgpt_poe_export.py
      - .github/workflows/chatgpt-poe-export.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-poe-export-20260730

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Extract and validate PoB codes
        id: export
        shell: bash
        run: |
          set +e
          python tools/chatgpt_poe_export.py
          status=$?
          mkdir -p artifacts/poe
          printf '%s\n' "$status" > artifacts/poe/exit_code.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TXT files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poe-pob-codes-sorted-by-dps
          path: artifacts/poe/
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated artifacts to isolated branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/poe
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "data: add filtered PoB export [skip ci]"
            git push origin HEAD:chatgpt-poe-export-20260730
          fi

      - name: Enforce requested minimum
        if: always()
        shell: bash
        run: exit "${{ steps.export.outputs.status }}"
